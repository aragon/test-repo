<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare Pages Test</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 80px auto;
      padding: 0 20px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 24px;
      margin-top: 24px;
    }
    .label {
      font-weight: bold;
      color: #555;
    }
    .value {
      font-family: monospace;
      background: #f4f4f4;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Cloudflare Pages Test</h1>
  <div class="card">
    <p><span class="label">Build-time var (BUILD_VAR):</span> <span class="value">__BUILD_VAR__</span></p>
    <p><span class="label">Runtime var (MY_VARIABLE):</span> <span id="variable" class="value">loading...</span></p>
    <p><span class="label">Runtime secret (MY_SECRET):</span> <span id="secret" class="value">loading...</span></p>
  </div>

  <script>
    fetch("/api/env")
      .then(res => res.json())
      .then(data => {
        document.getElementById("variable").textContent = data.variable ?? "not set";
        document.getElementById("secret").textContent = data.secret ?? "not set";
      })
      .catch(err => {
        document.getElementById("variable").textContent = "error";
        document.getElementById("secret").textContent = "error";
        document.getElementById("variable").classList.add("error");
        document.getElementById("secret").classList.add("error");
      });
  </script>
</body>
</html>
